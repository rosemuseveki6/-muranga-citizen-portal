<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murang'a Citizen Portal</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f5f5f5; margin:0; font-family:Arial;}
.top-bar{background:#e8f5e9; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #c8e6c9;}
.card{background:white; border-radius:12px; padding:15px; margin:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px;}
.stat-card{background:white; border-radius:10px; padding:15px; text-align:center; border-top:4px solid #1b5e20;}
.badge{padding:3px 8px; border-radius:10px; font-size:12px; color:white; font-weight:bold;}
.Pending{background:#f57c00;} .InProgress{background:#1976d2;} .Resolved{background:#388e3c;}
input, select, textarea{width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; margin-top:5px; margin-bottom:12px; font-size:14px;}
button.submit{background:#1b5e20; color:white; border:none; padding:12px; border-radius:8px; width:100%; font-weight:bold; font-size:15px; cursor:pointer;}
</style>
</head>
<body>

<div class="top-bar">
  <span style="color:#1b5e20; font-weight:bold;">Welcome, <span id="userDisplay">Regina</span>!</span>
  <button onclick="logout()" style="background:#c62828; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Logout</button>
</div>

<div class="stat-grid">
  <div class="stat-card"><h2 id="totalReq">0</h2><div>Total</div></div>
  <div class="stat-card"><h2 id="pendingReq">0</h2><div>Pending</div></div>
  <div class="stat-card"><h2 id="progressReq">0</h2><div>In Progress</div></div>
  <div class="stat-card"><h2 id="resolvedReq">0</h2><div>Resolved</div></div>
</div>

<div class="card">
  <h2>Submit New Request</h2>
  <form id="requestForm">
    <label>Category *</label>
    <select id="category" required>
      <option value="">Select Category</option>
      <option>Water</option><option>Roads</option><option>Garbage</option><option>Health</option><option>Electricity</option><option>Other</option>
    </select>
    <label>Location *</label>
    <input id="location" placeholder="Ward/Village e.g Kiharu" required>
    <label>Description *</label>
    <textarea id="description" placeholder="Describe issue..." required rows="3"></textarea>
    
    <label>Attach Image (Optional) 📷</label>
    <input type="file" id="requestImage" accept="image/*" onchange="previewImage(event)">
    <div id="imagePreview"></div>

    <button type="submit" class="submit">Submit Request</button>
  </form>
</div>

<div class="card">
  <h2>My Requests</h2>
  <div id="myRequests"></div>
</div>

<script>
const STORAGE_KEY = 'muranga_requests';
function getRequests(){return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}
function saveRequests(d){localStorage.setItem(STORAGE_KEY, JSON.stringify(d));}
function logout(){localStorage.removeItem('citizenName'); localStorage.removeItem('citizenLogged'); window.location.href='login.html';}

document.addEventListener('DOMContentLoaded', ()=>{
  // HAIKATII LOGIN TENA - INACHUKUA JINA TU
  const name = localStorage.getItem('citizenName') || localStorage.getItem('userName') || 'Regina';
  document.getElementById('userDisplay').textContent = name;
  renderCitizen();

  document.getElementById('requestForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const category=document.getElementById('category').value;
    const location=document.getElementById('location').value.trim();
    const description=document.getElementById('description').value.trim();
    const imageInput=document.getElementById('requestImage');
    if(!category || !location || !description){alert('Fill all required fields'); return;}
    if(imageInput && imageInput.files[0]){
      const reader=new FileReader();
      reader.onload=function(ev){ createRequest(category, location, description, ev.target.result); };
      reader.readAsDataURL(imageInput.files[0]);
    }else{ createRequest(category, location, description, ''); }
  });
});

function createRequest(category, location, description, image){
  const requests=getRequests();
  const newReq={id:'REQ-'+Date.now(), category, location, description, image, status:'Pending', date:new Date().toLocaleDateString()};
  requests.unshift(newReq);
  saveRequests(requests);
  alert('Submitted: '+newReq.id);
  document.getElementById('requestForm').reset();
  document.getElementById('imagePreview').innerHTML='';
  renderCitizen();
}

function renderCitizen(){
  const container=document.getElementById('myRequests');
  const requests=getRequests();
  if(requests.length===0){container.innerHTML='<p style="color:#888;">No requests yet</p>'; updateStats(); return;}
  container.innerHTML=requests.map(r=>`
    <div style="border:1px solid #eee; padding:10px; border-radius:8px; margin-bottom:10px;">
      <span class="badge ${r.status.replace(' ','')}">${r.status}</span>
      <h4 style="margin:8px 0;">${r.category} - ${r.location}</h4>
      <p style="margin:5px 0;">${r.description}</p>
      <small style="color:#888;">${r.id} | ${r.date}</small>
      ${r.image ? `<br><img src="${r.image}" style="width:100%; max-height:220px; object-fit:cover; margin-top:8px; border-radius:8px;">` : ''}
    </div>
  `).join('');
  updateStats();
}

function updateStats(){
  const req=getRequests();
  document.getElementById('totalReq').textContent=req.length;
  document.getElementById('pendingReq').textContent=req.filter(r=>r.status==='Pending').length;
  document.getElementById('progressReq').textContent=req.filter(r=>r.status==='In Progress').length;
  document.getElementById('resolvedReq').textContent=req.filter(r=>r.status==='Resolved').length;
}

function previewImage(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('imagePreview').innerHTML=`<img src="${e.target.result}" style="width:100%; max-height:180px; object-fit:cover; border-radius:8px; margin-top:8px; border:1px solid #ddd;">`;
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
