<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murang'a Citizen Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>🌍 Murang'a Citizen Portal</h1>
<p>Report Issues - Water, Roads, Garbage, Electricity</p>
<a href="admin.html" style="background:white;color:#1a5d1a;padding:8px 12px;border-radius:5px;text-decoration:none;font-weight:bold;">Admin Dashboard</a>
</header>
<!-- CITIZEN AUTH -->
<div class="container" id="authSection">
  <div class="card" id="loginCard">
    <h2>Citizen Login</h2>
    <label>ID Number *</label>
    <input type="text" id="citizenId" placeholder="Enter ID">
    <label>Password *</label>
    <input type="password" id="citizenPass" placeholder="Enter password">
    <button onclick="loginCitizen()">Login</button>
    <p style="margin-top:10px; text-align:center;">No account? <a href="#" onclick="showRegister()">Register here</a></p>
  </div>

  <div class="card hidden" id="registerCard">
    <h2>Citizen Registration</h2>
    <label>Full Name *</label>
    <input type="text" id="regName" placeholder="John Doe">
    <label>ID Number *</label>
    <input type="text" id="regId" placeholder="ID Number">
    <label>Phone *</label>
    <input type="text" id="regPhone" placeholder="07...">
    <label>Password *</label>
    <input type="password" id="regPass" placeholder="Create password">
    <button onclick="registerCitizen()">Register</button>
    <p style="margin-top:10px; text-align:center;">Have account? <a href="#" onclick="showLogin()">Login here</a></p>
  </div>

  <div class="card hidden" id="welcomeCard">
    <h3 id="welcomeMsg"></h3>
    <button onclick="logoutCitizen()" style="background:#c62828; width:auto; padding:8px 15px;">Logout</button>
  </div>
</div>
<!-- END AUTH -->
<main class="container">
<div class="stats">
<div class="stat-card"><h2 id="totalReq">0</h2><p>Total</p></div>
<div class="stat-card"><h2 id="pendingReq">0</h2><p>Pending</p></div>
<div class="stat-card"><h2 id="progressReq">0</h2><p>In Progress</p></div>
<div class="stat-card"><h2 id="resolvedReq">0</h2><p>Resolved</p></div>
</div>

<div class="card">
<h2>Submit New Request</h2>
<form id="requestForm">
<label>Category *</label>
<select id="category" required>
<option value="Water">Water</option>
<option value="Roads">Roads</option>
<option value="Garbage">Garbage</option>
<option value="Electricity">Electricity</option>
</select>

<label>Location / Ward *</label>
<input id="location" type="text" placeholder="e.g. Kangema, Kiharu..." required>

<label>Description *</label>
<textarea id="description" rows="4" placeholder="Describe the issue..." required></textarea>

<label>Upload Image (Optional)</label>
<input id="image" type="file" accept="image/*" onchange="previewImage(event)">
<div id="imagePreview"></div>

<button type="submit">Submit Request</button>
</form>
</div>

<div class="card">
<h2>My Requests</h2>
<div id="myRequests"><p>No requests yet</p></div>
</div>
</main>

<script src="app.js"></script>
</body>
</html>
