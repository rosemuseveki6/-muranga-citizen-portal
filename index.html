<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murang'a Citizen Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>🌍 Murang'a Citizen Portal</h1>
<p>Report Issues - Water, Roads, Garbage, Electricity</p>
<header>
<h1>🌍 Murang'a Citizen Portal</h1>
<p>Report Issues - Water, Roads, Garbage</p>
<a href="admin.html" style="background:white; color:#2e7d32; padding:6px 12px; border-radius:5px; text-decoration:none;">Admin</a>
</header>

<script>
// If not logged in, redirect to login.html
const currentCitizen = JSON.parse(localStorage.getItem('currentCitizen') || "null");
if(!currentCitizen){
  window.location.href = "login.html";
}
</script>

<div style="background:#e8f5e9; padding:10px 20px; display:flex; justify-content:space-between; align-items:center;">
  <span id="welcomeMsg" style="font-weight:bold; color:#2e7d32;"></span>
  <button onclick="logout()" style="background:#c62828; width:auto; padding:6px 14px; font-size:14px; color:white; border:none; border-radius:5px;">Logout</button>
</div>

<script>
  const c = JSON.parse(localStorage.getItem('currentCitizen') || "null");
  if(c) document.getElementById('welcomeMsg').innerText = "Welcome, " + c.name;
  function logout(){ localStorage.removeItem('currentCitizen'); window.location.href="login.html"; }
</script>

<main class="container">

<main class="container">
<div class="stats">
<div class="stat-card"><h2 id="totalReq">0</h2><p>Total</p></div>
<div class="stat-card"><h2 id="pendingReq">0</h2><p>Pending</p></div>
<div class="stat-card"><h2 id="progressReq">0</h2><p>In Progress</p></div>
<div class="stat-card"><h2 id="resolvedReq">0</h2><p>Resolved</p></div>
</div>

<div class="card">
<h2>Submit New Request</h2>
<form id="requestForm">
<label>Category *</label>
<select id="category" required>
<option value="Water">Water</option>
<option value="Roads">Roads</option>
<option value="Garbage">Garbage</option>
<option value="Electricity">Electricity</option>
</select>

<label>Location / Ward *</label>
<input id="location" type="text" placeholder="e.g. Kangema, Kiharu..." required>

<label>Description *</label>
<textarea id="description" rows="4" placeholder="Describe the issue..." required></textarea>

<label>Upload Image (Optional)</label>
<input id="image" type="file" accept="image/*" onchange="previewImage(event)">
<div id="imagePreview"></div>

<button type="submit">Submit Request</button>
</form>
</div>

<div class="card">
<h2>My Requests</h2>
<div id="myRequests"><p>No requests yet</p></div>
</div>
</main>

<script src="app.js"></script>
</body>
</html>
