<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murang'a Citizen Portal</title>
<link rel="stylesheet" href="style.css">
<script>
// Protect - must login first
const currentCitizen = JSON.parse(localStorage.getItem('currentCitizen') || "null");
if(!currentCitizen){ window.location.href="login.html"; }
</script>
</head>
<body>
<header>
<h1>🌍 Murang'a Citizen Portal</h1>
<p>Report Issues - Water, Roads, Garbage, Electricity</p>
<a href="admin.html" style="background:white; color:#2e7d32; padding:6px 12px; border-radius:5px; text-decoration:none;">Admin</a>
</header>

<div style="background:#e8f5e9; padding:10px 20px; display:flex; justify-content:space-between; align-items:center;">
  <span id="welcomeMsg" style="font-weight:bold; color:#2e7d32;"></span>
  <button onclick="logout()" style="background:#c62828; width:auto; padding:6px 14px; font-size:14px; color:white; border:none; border-radius:5px;">Logout</button>
</div>

<main class="container">
  <div class="stats">
    <div class="stat-card"><h3 id="total">0</h3><p>Total</p></div>
    <div class="stat-card"><h3 id="pending">0</h3><p>Pending</p></div>
    <div class="stat-card"><h3 id="inprogress">0</h3><p>In Progress</p></div>
    <div class="stat-card"><h3 id="resolved">0</h3><p>Resolved</p></div>
  </div>

  <div class="card">
    <h2>Submit New Request</h2>
    <label>Category *</label>
    <select id="category"><option value="">Select Category</option><option>Water</option><option>Roads</option><option>Garbage</option><option>Electricity</option></select>
    <label>Location *</label>
    <input type="text" id="location" placeholder="Ward/Village">
    <label>Description *</label>
    <textarea id="description" placeholder="Describe issue..."></textarea>
    <button onclick="submitRequest()">Submit Request</button>
  </div>

  <div class="card">
    <h2>My Requests</h2>
    <div id="requestsList"></div>
  </div>
</main>

<script>
  const c = JSON.parse(localStorage.getItem('currentCitizen') || "null");
  if(c) document.getElementById('welcomeMsg').innerText = "Welcome, " + c.name;
  function logout(){ localStorage.removeItem('currentCitizen'); window.location.href="login.html"; }
</script>
<script src="app.js"></script>
</body>
</html>
